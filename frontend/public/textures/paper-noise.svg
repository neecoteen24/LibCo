<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <filter id="paperNoise">
    <!-- Fine grain -->
    <feTurbulence
      type="fractalNoise"
      baseFrequency="1.6"
      numOctaves="5"
      seed="3"
      result="fine" />

    <!-- Larger fiber variation -->
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.35"
      numOctaves="3"
      seed="8"
      result="coarse" />

    <!-- Blend both scales -->
    <feBlend in="fine" in2="coarse" mode="multiply" result="blend"/>

    <!-- Boost contrast so grain is visible -->
    <feComponentTransfer>
      <feFuncR type="gamma" amplitude="1.4" exponent="1.2"/>
      <feFuncG type="gamma" amplitude="1.4" exponent="1.2"/>
      <feFuncB type="gamma" amplitude="1.4" exponent="1.2"/>
    </feComponentTransfer>
  </filter>

  <!-- Important: give the filter pixels to work with -->
  <rect width="100%" height="100%" fill="#808080" filter="url(#paperNoise)"/>
</svg>
